services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: trustelect
      POSTGRES_PASSWORD: trustelect_local_only
      POSTGRES_DB: trustelect
    ports:
      - "5442:5432"
    shm_size: 256m
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustelect -d trustelect"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
