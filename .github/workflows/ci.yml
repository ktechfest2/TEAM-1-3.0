name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: trustelect
          POSTGRES_PASSWORD: trustelect_local_only
          POSTGRES_DB: trustelect
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trustelect -d trustelect"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://trustelect:trustelect_local_only@localhost:5432/trustelect
      DISABLE_TELEMETRY: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build shared package
        run: npm run build -w @trustelect/shared

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Migrate database
        run: npm run db:migrate

      - name: End-to-end tests
        run: npm run test:e2e -w @trustelect/api

      - name: Build
        run: npm run build
